          const startSimulation = () => {
            setStarted(true);
            // Initialize with a diverse mix of content
            const initialPosts = [
              ...shuffleArray(contentLibrary.polarizing).slice(0, 1),
              ...shuffleArray(contentLibrary.shallow).slice(0, 1),
              ...shuffleArray(contentLibrary.educational).slice(0, 1),
              ...shuffleArray(contentLibrary.misinformation).slice(0, 1),
              ...shuffleArray(contentLibrary.balanced).slice(0, 1),
              ...shuffleArray(contentLibrary.dopamine).slice(0, 1)
            ];
            setPosts(shuffleArray(initialPosts).map((post, idx) => ({ ...post, id: idx + 1 })));
          };

          const shuffleArray = (array) => {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
          };

          const handlePostClick = (post) => {
            // Record interaction
            const newInteractions = [...interactions, { 
              postId: post.id, 
              type: post.type, 
              timestamp: Date.now() 
            }];
            setInteractions(newInteractions);

            // Update metrics based on post impact
            setMetrics(prev => ({
              attentionSpan: Math.max(0, Math.min(100, prev.attentionSpan + post.impact.attention)),
              polarizationIndex: Math.max(0, Math.min(100, prev.polarizationIndex + post.impact.polarization)),
              criticalThinking: Math.max(0, Math.min(100, prev.criticalThinking + post.impact.critical)),
              diversityScore: Math.max(0, Math.min(100, prev.diversityScore + post.impact.diversity))
            }));

            // Mark post as read
            setPosts(prev => prev.map(p => p.id === post.id ? { ...p, read: true } : p));

            // Check for interventions
            if (newInteractions.length >= 3) {
              checkForIntervention(newInteractions);
            }

            // Generate new content after certain interactions
            if (newInteractions.length === 4 || newInteractions.length === 7 || newInteractions.length === 10) {
              generateNewPosts(newInteractions);
            }

            // Show report after 12 interactions
            if (newInteractions.length >= 12) {
              setShowReport(true);
            }
          };

          const checkForIntervention = (interactions) => {
            const recentInteractions = interactions.slice(-3);
            const polarizingCount = recentInteractions.filter(i => 
              posts.find(p => p.id === i.postId)?.type === 'polarizing'
            ).length;
            
            const shallowCount = recentInteractions.filter(i => {
              const postType = posts.find(p => p.id === i.postId)?.type;
              return postType === 'shallow' || postType === 'dopamine';
            }).length;

            const missinfoCount = recentInteractions.filter(i => 
              posts.find(p => p.id === i.postId)?.type === 'misinformation'
            ).length;

            if (polarizingCount >= 2 && !showIntervention) {
              setInterventionMessage('⚠️ Echo Chamber Alert: You\'ve consumed multiple polarizing posts in a row. Your feed is now being algorithmically optimized for engagement, not truth. The system has learned you prefer emotional content and will show you MORE of it. Try seeking diverse perspectives.');
              setShowIntervention(true);
              setTimeout(() => setShowIntervention(false), 6000);
            } else if (shallowCount >= 2 && !showIntervention) {
              setInterventionMessage('🧠 Attention Pattern Notice: You\'re consuming high-dopamine, low-depth content. Research shows this pattern is associated with reduced attention span and critical thinking capacity. Consider engaging with longer-form, thoughtful content.');
              setShowIntervention(true);
              setTimeout(() => setShowIntervention(false), 6000);
            } else if (missinfoCount >= 1 && !showIntervention) {
              setInterventionMessage('🚨 Misinformation Warning: You just engaged with unverified content. Always check sources, look for corroboration, and be skeptical of sensational claims. Your critical thinking score has decreased.');
              setShowIntervention(true);

            }
          };

          const generateNewPosts = (userInteractions) => {

            // Analyze user behavior pattern - what type of content do they prefer?
            const typeCount = userInteractions.reduce((acc, interaction) => {
              const postType = posts.find(p => p.id === interaction.postId)?.type;
              if (postType) {
                acc[postType] = (acc[postType] || 0) + 1;
              }
              return acc;
            }, {});

            // Find dominant content types
            const sortedTypes = Object.entries(typeCount).sort((a, b) => b[1] - a[1]);
            const dominantType = sortedTypes[0]?.[0] || 'balanced';
            const secondaryType = sortedTypes[1]?.[0] || 'shallow';

            // Algorithmically personalize: show MORE of what they clicked (70% match their preference)
            const newPosts = [];
            const numPosts = 4;

            const matchingCount = Math.ceil(numPosts * 0.7);

              newPosts.push(...shuffleArray(availableRandom).slice(0, numPosts - newPosts.length));

              metrics.diversityScore
            ) / 4;

            if (avg >= 80) return { grade: 'A', label: 'Excellent Digital Citizen', color: 'text-green-600' };
            if (avg >= 60) return { grade: 'B', label: 'Good Digital Awareness', color: 'text-blue-600' };
            if (avg >= 40) return { grade: 'C', label: 'Vulnerable to Manipulation', color: 'text-yellow-600' };
            return { grade: 'D', label: 'High Risk - Needs Intervention', color: 'text-red-600' };
          };

          const resetSimulation = () => {
            setStarted(false);
            setPosts([]);
            setMetrics({
              attentionSpan: 100,
              polarizationIndex: 0,
              criticalThinking: 100,
              diversityScore: 100
            });
            setInteractions([]);
            setShowReport(false);
            setFeedStage(1);
            setShowIntervention(false);
          };

          if (!started) {
            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 flex items-center justify-center p-4">
                <div className="max-w-3xl bg-white rounded-2xl shadow-2xl p-8">
                  <div className="text-center">
                    <Brain className="w-16 h-16 mx-auto mb-4 text-purple-600" />
                    <h1 className="text-3xl font-bold text-gray-900 mb-4">
                      Social Media Echo Chamber Simulator
                    </h1>
                    <p className="text-lg text-gray-600 mb-2">
                        Explore how algorithms shape your digital experience <br></br>{'(hard coded version)'}
                    </p>
                    <p className="text-lg text-gray-600 mb-2">
                      AI-Mediated Digital Citizenship Lab
                    </p>
                    <p className="text-sm text-gray-500 mb-6">
                      Research Tool for SAARC Youth Digital Behavior Analysis
                    </p>
                    
                    <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 text-left">
                      <p className="text-sm text-yellow-800">
                        <strong>⚠️ Educational Simulation:</strong> This tool demonstrates how algorithms shape your digital experience by tracking what you click and adapting the content you see - just like real social media platforms. Your choices create a personalized feedback loop.
                      </p>
                    </div>

                    <div className="text-left space-y-4 mb-8">
                      <h3 className="font-semibold text-gray-900 flex items-center">
                        <Eye className="w-5 h-5 mr-2 text-blue-600" />
                        How It Works:
                      </h3>
                      <ul className="space-y-2 text-gray-700 text-sm ml-7">
                        <li>• Click on posts to "consume" content</li>
                        <li>• Watch your cognitive metrics change in real-time</li>
                        <li>• The algorithm learns your preferences and adapts your feed</li>
                        <li>• Experience how echo chambers form naturally</li>
                        <li>• Receive educational interventions when at risk</li>
                        <li>• Get your Digital Citizenship Report Card</li>
                      </ul>

                      <h3 className="font-semibold text-gray-900 flex items-center mt-6">
                        <TrendingUp className="w-5 h-5 mr-2 text-green-600" />
                        Metrics Tracked:
                      </h3>
                      <ul className="space-y-2 text-gray-700 text-sm ml-7">
                        <li>• <strong>Attention Span:</strong> Capacity for deep focus and sustained concentration</li>
                        <li>• <strong>Polarization Index:</strong> How extreme your information diet becomes</li>
                        <li>• <strong>Critical Thinking:</strong> Ability to evaluate information objectively</li>
                        <li>• <strong>Diversity Score:</strong> Exposure to different perspectives</li>
                      </ul>
                    </div>

                    <button
                      onClick={startSimulation}
                      className="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-4 rounded-lg font-semibold text-lg hover:from-purple-700 hover:to-blue-700 transition shadow-lg"
                    >
                      Start Simulation
                    </button>

                    <div className="mt-6 text-center">
                      <p className="text-xs text-gray-500">
                        Research by Kartik Kashyap • SAARC Internship Programme
                      </p>
                      <p className="text-xs text-gray-400 mt-1">
                        AI-Mediated Digital Citizenship Among Youth in SAARC Nations
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          if (showReport) {
            const { grade, label, color } = calculateGrade();
            const avgScore = (
              metrics.attentionSpan + 
              (100 - metrics.polarizationIndex) + 
              metrics.criticalThinking + 
              metrics.diversityScore
            ) / 4;

            // Analyze behavior pattern
            const typeCount = interactions.reduce((acc, interaction) => {
              const post = posts.find(p => p.id === interaction.postId);
              if (post) {
                acc[post.type] = (acc[post.type] || 0) + 1;
              }
              return acc;
            }, {});

            const mostConsumed = Object.entries(typeCount).sort((a, b) => b[1] - a[1])[0];

            return (
              <div className="min-h-screen bg-gradient-to-br from-blue-900 via-purple-900 to-indigo-900 p-4 flex items-center justify-center">
                <div className="max-w-3xl w-full bg-white rounded-2xl shadow-2xl p-8">
                  <div className="text-center mb-8">
                    <Award className="w-20 h-20 mx-auto mb-4 text-yellow-500" />
                    <h2 className="text-3xl font-bold text-gray-900 mb-2">
                      Digital Citizenship Report Card
                    </h2>
                    <div className={`text-6xl font-bold ${color} my-4`}>{grade}</div>
                    <p className="text-xl text-gray-700">{label}</p>
                    <p className="text-sm text-gray-500 mt-2">
                      Overall Score: {avgScore.toFixed(1)}%
                    </p>
                  </div>

                  <div className="space-y-6 mb-8">
                    <div>
                      <div className="flex justify-between mb-2">
                        <span className="font-semibold">Attention Span</span>
                        <span className={`font-bold ${getMetricColor(metrics.attentionSpan)}`}>
                          {metrics.attentionSpan.toFixed(0)}%
                        </span>
                      </div>
                      <div className="w-full bg-gray-200 rounded-full h-3">
                        <div 
                          className={`h-3 rounded-full transition-all ${getMetricBgColor(metrics.attentionSpan)}`}
                          style={{ width: `${metrics.attentionSpan}%` }}
                        />
                      </div>
                      <p className="text-xs text-gray-600 mt-1">
                        {metrics.attentionSpan >= 70 ? 'Excellent capacity for deep focus' : 
                         metrics.attentionSpan >= 40 ? 'Moderate attention - vulnerable to distraction' :
                         'Severely reduced attention span - high-risk pattern'}
                      </p>
                    </div>

                    <div>
                      <div className="flex justify-between mb-2">
                        <span className="font-semibold">Polarization Resistance</span>
                        <span className={`font-bold ${getMetricColor(100 - metrics.polarizationIndex)}`}>
                          {(100 - metrics.polarizationIndex).toFixed(0)}%
                        </span>
                      </div>
                      <div className="w-full bg-gray-200 rounded-full h-3">
                        <div 
                          className={`h-3 rounded-full transition-all ${getMetricBgColor(100 - metrics.polarizationIndex)}`}
                          style={{ width: `${100 - metrics.polarizationIndex}%` }}
                        />
                      </div>
                      <p className="text-xs text-gray-600 mt-1">
                        {metrics.polarizationIndex <= 30 ? 'Strong resistance to echo chambers' : 
                         metrics.polarizationIndex <= 60 ? 'Moderately influenced by algorithmic bias' :
                         'Deep in echo chamber - severely polarized information diet'}
                      </p>
                    </div>

                    <div>
                      <div className="flex justify-between mb-2">
                        <span className="font-semibold">Critical Thinking</span>
                        <span className={`font-bold ${getMetricColor(metrics.criticalThinking)}`}>
                          {metrics.criticalThinking.toFixed(0)}%
                        </span>
                      </div>
                      <div className="w-full bg-gray-200 rounded-full h-3">
                        <div 
                          className={`h-3 rounded-full transition-all ${getMetricBgColor(metrics.criticalThinking)}`}
                          style={{ width: `${metrics.criticalThinking}%` }}
                        />
                      </div>
                      <p className="text-xs text-gray-600 mt-1">
                        {metrics.criticalThinking >= 70 ? 'Strong analytical and evaluation skills' : 
                         metrics.criticalThinking >= 40 ? 'Moderate critical thinking - needs development' :
                         'Critically vulnerable to misinformation and manipulation'}
                      </p>
                    </div>

                    <div>
                      <div className="flex justify-between mb-2">
                        <span className="font-semibold">Perspective Diversity</span>
                        <span className={`font-bold ${getMetricColor(metrics.diversityScore)}`}>
                          {metrics.diversityScore.toFixed(0)}%
                        </span>
                      </div>
                      <div className="w-full bg-gray-200 rounded-full h-3">
                        <div 
                          className={`h-3 rounded-full transition-all ${getMetricBgColor(metrics.diversityScore)}`}
                          style={{ width: `${metrics.diversityScore}%` }}
                        />
                      </div>
                      <p className="text-xs text-gray-600 mt-1">
                        {metrics.diversityScore >= 70 ? 'Exposed to wide range of viewpoints' : 
                         metrics.diversityScore >= 40 ? 'Limited perspective diversity' :
                         'Narrow information diet - filter bubble detected'}
                      </p>
                    </div>
                  </div>

                  <div className="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
                    <h3 className="font-semibold text-blue-900 mb-2">📊 Your Behavior Pattern Analysis:</h3>
                    <p className="text-sm text-blue-800 mb-2">
                      You interacted with {interactions.length} posts. Your primary content consumption was <strong>{mostConsumed?.[0] || 'varied'}</strong> content ({mostConsumed?.[1] || 0} posts).
                    </p>
                    <p className="text-sm text-blue-800">
                      {avgScore >= 70 && "✅ You demonstrated strong digital literacy, actively sought diverse perspectives, and resisted algorithmic manipulation. This behavior pattern indicates high resilience to echo chambers and misinformation. Keep practicing conscious media consumption!"}
                      {avgScore >= 40 && avgScore < 70 && "⚠️ You showed some vulnerability to algorithmic manipulation and echo chamber formation. Your content choices suggest susceptibility to engagement-optimized feeds. Consider being more intentional about seeking diverse viewpoints and fact-checking sensational claims."}
                      {avgScore < 40 && "🚨 Your interaction pattern shows high susceptibility to echo chambers, misinformation, and shallow content. This is exactly how algorithms trap users in filter bubbles. The system has learned to show you emotionally engaging but intellectually shallow content. Critical intervention needed."}
                    </p>
                  </div>

                  <div className="bg-purple-50 border-l-4 border-purple-500 p-4 mb-6">
                    <h3 className="font-semibold text-purple-900 mb-2 flex items-center">
                      <BookOpen className="w-5 h-5 mr-2" />
                      Key Educational Insights:
                    </h3>
                    <ul className="text-sm text-purple-800 space-y-2">
                      <li>• <strong>Algorithmic Amplification:</strong> Platforms show you MORE of what you click, creating self-reinforcing feedback loops</li>
                      <li>• <strong>Engagement vs Truth:</strong> Algorithms optimize for your attention (profit), not your enlightenment or well-being</li>
                      <li>• <strong>Cognitive Impact:</strong> Short-form, high-dopamine content measurably reduces attention span and critical thinking</li>
                      <li>• <strong>Echo Chambers:</strong> Personalization creates filter bubbles that limit exposure to diverse perspectives</li>
                      <li>• <strong>Digital Citizenship:</strong> Conscious, intentional content consumption is a skill that must be actively practiced</li>
                    </ul>
                  </div>

                  {avgScore < 60 && (
                    <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
                      <h3 className="font-semibold text-red-900 mb-2">⚠️ Recommendations for Improvement:</h3>
                      <ul className="text-sm text-red-800 space-y-1">
                        <li>• Actively seek content that challenges your existing views</li>
                        <li>• Practice slow reading of long-form articles</li>
                        <li>• Fact-check sensational claims before sharing</li>
                        <li>• Follow accounts with diverse perspectives</li>
                        <li>• Take regular breaks from social media</li>
                        <li>• Engage with educational content that requires critical thinking</li>
                      </ul>
                    </div>
                  )}

                  <div className="flex gap-4">
                    <button
                      onClick={resetSimulation}
                      className="flex-1 bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-blue-700 transition shadow-lg flex items-center justify-center"
                    >
                      <RefreshCw className="w-5 h-5 mr-2" />
                      Try Again with Different Strategy
                    </button>
                  </div>

                  <div className="mt-6 text-center text-xs text-gray-500">
                    <p>This simulation demonstrates research findings on AI-mediated digital citizenship</p>
                    <p className="mt-1">Based on: SAARC Youth Digital Engagement Study • Kartik Kashyap</p>
                    <p className="mt-1 text-gray-400">Research Topic: AI-Mediated Digital Citizenship Among Youth in SAARC Nations</p>
                  </div>
                </div>
              </div>
            );
          }

          const unreadPosts = posts.filter(p => !p.read);

          return (
            <div className="min-h-screen bg-gray-100">
      {/* Header */}
      <div className="bg-gradient-to-r from-purple-600 to-blue-600 text-white p-4 shadow-lg sticky top-0 z-10">
        <div className="max-w-7xl mx-auto flex justify-between items-center">
          <div>
            <h1 className="text-xl font-bold">Your Personalized Social Feed</h1>
            <p className="text-sm opacity-90">Stage {feedStage} • {interactions.length} posts consumed • {unreadPosts.length} new</p>
          </div>
          <div className="flex gap-2">
            <button
              onClick={() => setShowReport(true)}
              className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold text-sm hover:bg-gray-100 transition"
            >
              View Report
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* Main Feed */}
        <div className="lg:col-span-2 space-y-4">
          {posts.map(post => (
            <div
              key={post.id}
              onClick={() => !post.read && handlePostClick(post)}
              className={`bg-white rounded-lg shadow p-4 transition ${
                post.read 
                  ? 'opacity-50 cursor-default' 
                  : 'hover:shadow-lg hover:scale-[1.01] cursor-pointer border-2 border-transparent hover:border-purple-200'
              }`}
            >
              <div className="flex items-start justify-between mb-2">
                <div className="flex items-center">
                  <div className="w-10 h-10 bg-gradient-to-br from-purple-400 to-blue-400 rounded-full mr-3 flex items-center justify-center text-white font-bold">
                    {post.author.charAt(0)}
                  </div>
                  <div>
                    <p className="font-semibold text-gray-900">{post.author}</p>
                    <p className="text-xs text-gray-500">{Math.floor(Math.random() * 5) + 1}h ago</p>
                  </div>
                </div>
                <div className="flex gap-2">
                  {post.isMisinfo && !post.read && (
                    <span className="bg-red-100 text-red-600 text-xs px-2 py-1 rounded font-medium">
                      ⚠️ Verify
                    </span>
                  )}
                  {post.type === 'educational' && !post.read && (
                    <span className="bg-blue-100 text-blue-600 text-xs px-2 py-1 rounded font-medium">
                      📚 Thoughtful
                    </span>
                  )}
                </div>
              </div>
              
              <p className="text-gray-800 mb-3 leading-relaxed">{post.content}</p>
              
              <div className="flex items-center justify-between text-sm text-gray-500">
                <span>{post.engagement}</span>
                {!post.read && (
                  <span className="text-purple-600 font-medium">Click to read →</span>
                )}
              </div>
            </div>
          ))}

          {unreadPosts.length === 0 && !showReport && (
            <div className="bg-white rounded-lg shadow p-8 text-center">
              <p className="text-gray-600 mb-4 text-lg">You've consumed all available content in your feed!</p>
              <p className="text-gray-500 text-sm mb-6">
                This is how algorithms work - they keep feeding you content based on your behavior. 
                In reality, the feed never ends.
              </p>
              <button
                onClick={() => setShowReport(true)}
                className="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-8 py-3 rounded-lg font-semibold hover:from-purple-700 hover:to-blue-700 transition shadow-lg"
              >
                View Final Report Card
              </button>
            </div>
          )}
        </div>

        {/* Metrics Sidebar */}
        <div className="space-y-4">
          <div className="bg-white rounded-lg shadow-lg p-5 sticky top-24">
            <h3 className="font-bold text-gray-900 mb-4 flex items-center">
              <Brain className="w-5 h-5 mr-2 text-purple-600" />
              Live Cognitive Metrics
            </h3>

            <div className="space-y-4">
              <div>
                <div className="flex justify-between mb-1">
                  <span className="text-sm font-medium">Attention Span</span>
                  <span className={`text-sm font-bold ${getMetricColor(metrics.attentionSpan)}`}>
                    {metrics.attentionSpan.toFixed(0)}%
                  </span>
                </div>
                <div className="w-full bg-gray-200 rounded-full h-2">
                  <div 
                    className={`h-2 rounded-full transition-all duration-500 ${getMetricBgColor(metrics.attentionSpan)}`}
                    style={{ width: `${metrics.attentionSpan}%` }}
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between mb-1">
                  <span className="text-sm font-medium">Polarization</span>
                  <span className={`text-sm font-bold ${getMetricColor(metrics.polarizationIndex, true)}`}>
                    {metrics.polarizationIndex.toFixed(0)}%
                  </span>
                </div>
                <div className="w-full bg-gray-200 rounded-full h-2">
                  <div 
                    className={`h-2 rounded-full transition-all duration-500 ${getMetricBgColor(metrics.polarizationIndex, true)}`}
                    style={{ width: `${metrics.polarizationIndex}%` }}
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between mb-1">
                  <span className="text-sm font-medium">Critical Thinking</span>
                  <span className={`text-sm font-bold ${getMetricColor(metrics.criticalThinking)}`}>
                    {metrics.criticalThinking.toFixed(0)}%
                  </span>
                </div>
                <div className="w-full bg-gray-200 rounded-full h-2">
                  <div 
                    className={`h-2 rounded-full transition-all duration-500 ${getMetricBgColor(metrics.criticalThinking)}`}
                    style={{ width: `${metrics.criticalThinking}%` }}
                  />
                </div>
              </div>

              <div>
                <div className="flex justify-between mb-1">
                  <span className="text-sm font-medium">Diversity Score</span>
                  <span className={`text-sm font-bold ${getMetricColor(metrics.diversityScore)}`}>
                    {metrics.diversityScore.toFixed(0)}%
                  </span>
                </div>
                <div className="w-full bg-gray-200 rounded-full h-2">
                  <div 
                    className={`h-2 rounded-full transition-all duration-500 ${getMetricBgColor(metrics.diversityScore)}`}
                    style={{ width: `${metrics.diversityScore}%` }}
                  />
                </div>
              </div>
            </div>

            <div className="mt-4 pt-4 border-t border-gray-200">
              <p className="text-xs text-gray-600 leading-relaxed">
                These metrics update in real-time based on your content consumption patterns. 
                The algorithm is learning your preferences and will adapt your feed accordingly.
              </p>
            </div>
          </div>

          {/* Intervention Alert */}
          {showIntervention && (
            <div className="bg-yellow-50 border-l-4 border-yellow-400 rounded-lg p-4 shadow-lg animate-pulse">
              <div className="flex items-start">
                <AlertTriangle className="w-5 h-5 text-yellow-600 mr-2 flex-shrink-0 mt-0.5" />
                <div>
                  <h4 className="font-semibold text-yellow-900 text-sm mb-1">
                    Educational Intervention
                  </h4>
                  <p className="text-xs text-yellow-800 leading-relaxed">{interventionMessage}</p>
                </div>
              </div>
            </div>
          )}

          {/* Quick Tips */}
          <div className="bg-blue-50 rounded-lg p-4 shadow">
            <h4 className="font-semibold text-blue-900 text-sm mb-2">💡 Digital Citizenship Tips</h4>
            <ul className="text-xs text-blue-800 space-y-1">
              <li>• Question emotional content</li>
              <li>• Seek diverse perspectives</li>
              <li>• Verify before sharing</li>
              <li>• Take breaks from feeds</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  );
};
